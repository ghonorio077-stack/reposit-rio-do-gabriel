<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <STYLE>
        .containerali{
            background-color: rgb(168, 51, 4);
            padding: 10px;
            display: flex;
            flex-flow: row wrap;
            margin: 50px;
        }
        
        .itemali{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            flex: auto;
        }







        .container{
            background-color: lightsalmon;
            padding: 10px;
            display: flex;
            flex-flow: row wrap;
        }

        .item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;        
        }

        #i1{
            order: 0;
        }

        #i2{
            order: -2;
        }

        #i3{
            order: 4;
        }

        #i4{
            order: 8;
        }

        #i5{
            order: 2;
        }

        #i6{
            order: 0;
        }

        #i7{
            order: -4;
        }
        
    </STYLE>
</head>
<body>
    <div class="containerali">
        <div class="itemali" style="order: -2;">A</div>
        <div class="itemali" style="order: -3;">+</div>
        <div class="itemali">=</div>
        <div class="itemali">a</div>
        <div class="itemali">m</div>
        <div class="itemali">o</div>
        <div class="itemali">r</div>
        <div class="itemali" style="order: -4;">G</div>
    </div>

    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
