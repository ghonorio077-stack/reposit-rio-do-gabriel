<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{
            background-color: lightgray;
            height: 50px;
            width: 300px;
        
            border-width: 5px;
            border-style: solid;
            border-color: darkslategray;
                        =
            border: 5px solid darkslategray;
        
            padding: 10px 10px 50px 10px;
            margin: auto;
            margin: 20px auto 50px auto;

        
            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
                       =
            outline: 5px dashed salmon;
        }

        a{
            border: 3px groove red;
            padding: 10px 10px 10px 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box levels, mas os <a href="#">links são exemplos de caixas inline level</a> Vamos ver como tudo isso funciona.</p>
</body>
</html>
